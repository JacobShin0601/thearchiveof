name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:pages
      - run: npm run check:functions
      - name: Verify Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run check:cloudflare
      - name: Prepare initial analytics backfill
        if: github.event_name == 'pull_request' && github.head_ref == 'ops/analytics-first-sync'
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          ANALYTICS_HOSTNAME: thearchiveof.com
        run: node scripts/sync-cloudflare-analytics.mjs --days 30
      - name: Apply analytics schema to Preview D1
        if: github.event_name == 'pull_request' && github.head_ref == 'ops/analytics-first-sync'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply archive-interactions-preview --env preview --remote
      - name: Write initial analytics backfill to Preview D1
        if: github.event_name == 'pull_request' && github.head_ref == 'ops/analytics-first-sync'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute archive-interactions-preview --env preview --remote --file .analytics-sync.sql
      - name: Remove analytics backfill file
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'ops/analytics-first-sync'
        run: rm -f .analytics-sync.sql
      - run: npm run build
