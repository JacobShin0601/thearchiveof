name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:pages
      - run: npm run check:functions
      - name: Verify Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run check:cloudflare
      - run: npm run build

  migrate-equity-refresh-day:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/d1-equity-refresh-day'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Reconcile and apply D1 migration 0003
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail

          verify_base_tables() {
            local database="$1"
            local environment="$2"
            npx wrangler d1 execute "$database" --env "$environment" --remote \
              --command "SELECT COUNT(*) AS article_rows FROM article_reactions; SELECT COUNT(*) AS event_rows FROM interaction_events;"
          }

          reconcile_history() {
            local database="$1"
            local environment="$2"
            npx wrangler d1 execute "$database" --env "$environment" --remote \
              --command "CREATE TABLE IF NOT EXISTS d1_migrations (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT UNIQUE, applied_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP NOT NULL); INSERT OR IGNORE INTO d1_migrations (name) VALUES ('0001_article_reactions.sql'), ('0002_interaction_events.sql');"
          }

          apply_and_verify() {
            local database="$1"
            local environment="$2"
            npx wrangler d1 migrations list "$database" --env "$environment" --remote
            npx wrangler d1 migrations apply "$database" --env "$environment" --remote
            npx wrangler d1 execute "$database" --env "$environment" --remote \
              --command "SELECT day, hits FROM equity_refresh_day LIMIT 0; SELECT id, name, applied_at FROM d1_migrations ORDER BY id;"
            npx wrangler d1 migrations list "$database" --env "$environment" --remote
          }

          # The first two tables were created manually before Wrangler migration
          # tracking was introduced. Verify them before recording their history.
          verify_base_tables archive-interactions-preview preview
          reconcile_history archive-interactions-preview preview
          verify_base_tables archive-interactions-production production
          reconcile_history archive-interactions-production production

          # Make migration 0003 safe if the table was created in an earlier manual attempt.
          sed -i 's/^CREATE TABLE equity_refresh_day/CREATE TABLE IF NOT EXISTS equity_refresh_day/' migrations/0003_equity_refresh_day.sql

          # Preview must complete before Production is touched.
          apply_and_verify archive-interactions-preview preview
          apply_and_verify archive-interactions-production production
