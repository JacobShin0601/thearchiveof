name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:pages
      - run: npm run check:functions
      - name: Verify Cloudflare Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run check:cloudflare
      - name: Inspect Preview analytics bindings
        if: github.event_name == 'pull_request' && github.head_ref == 'ops/analytics-config-check'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(
            \`https://api.cloudflare.com/client/v4/accounts/\${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects/thearchiveof\`,
            { headers: { Authorization: \`Bearer \${process.env.CLOUDFLARE_API_TOKEN}\` } },
          );
          const body = await response.json();
          if (!response.ok) throw new Error(body.errors?.[0]?.message ?? response.statusText);
          const preview = body.result?.deployment_configs?.preview ?? {};
          const envVars = Object.fromEntries(Object.entries(preview.env_vars ?? {}).map(([name, item]) => [name, item?.type ?? 'unknown']));
          const d1 = Object.fromEntries(Object.entries(preview.d1_databases ?? {}).map(([name, item]) => [name, {
            database_name: item?.database_name ?? null,
            id_present: Boolean(item?.id),
          }]));
          console.log(JSON.stringify({ envVars, d1 }, null, 2));
          NODE
      - run: npm run build
