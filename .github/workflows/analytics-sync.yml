name: Analytics sync

on:
  schedule:
    - cron: '20 02 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: D1 target
        required: true
        type: choice
        default: preview
        options:
          - preview
          - production
      days:
        description: Complete UTC days to refresh (1-90)
        required: true
        default: '30'

permissions:
  contents: read

concurrency:
  group: analytics-sync-${{ inputs.environment || 'preview' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
      ANALYTICS_HOSTNAME: thearchiveof.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Prepare aggregate analytics rows
        run: node scripts/sync-cloudflare-analytics.mjs --days "${{ inputs.days || '2' }}"
      - name: Apply analytics migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENV: ${{ inputs.environment || 'preview' }}
        run: npx wrangler d1 migrations apply "archive-interactions-${TARGET_ENV}" --env "${TARGET_ENV}" --remote
      - name: Write aggregate analytics to D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET_ENV: ${{ inputs.environment || 'preview' }}
        run: npx wrangler d1 execute "archive-interactions-${TARGET_ENV}" --env "${TARGET_ENV}" --remote --file .analytics-sync.sql
      - if: always()
        run: rm -f .analytics-sync.sql
