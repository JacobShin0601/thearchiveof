<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Composable Enterprise Agent Platform</title>
  <desc id="desc">Tools combine with task instructions into modules, modules form agent runs, and dynamic orchestration decomposes problems and builds execution graphs.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#335f4b"/></marker>
  </defs>
  <rect width="1200" height="820" fill="#f2f0e9"/>
  <text x="68" y="68" fill="#1c201d" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="32" font-weight="700">Composable Enterprise Agent Platform</text>
  <text x="68" y="103" fill="#676b64" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="18">Why the original architecture was a rational choice</text>

  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif">
    <rect x="68" y="142" width="1064" height="130" fill="#f8f7f2" stroke="#c9c6bc" stroke-width="2"/>
    <text x="95" y="179" fill="#335f4b" font-size="14" font-weight="800" letter-spacing="2">01 · TOOLS</text>
    <text x="95" y="213" fill="#1c201d" font-size="20" font-weight="700">Developer capabilities</text>
    <g font-size="19" font-weight="650" text-anchor="middle" fill="#1c201d">
      <rect x="420" y="177" width="145" height="54" rx="27" fill="#e8e4da"/><text x="492" y="211">Search</text>
      <rect x="583" y="177" width="145" height="54" rx="27" fill="#e8e4da"/><text x="655" y="211">Database</text>
      <rect x="746" y="177" width="145" height="54" rx="27" fill="#e8e4da"/><text x="818" y="211">Python</text>
      <rect x="909" y="177" width="145" height="54" rx="27" fill="#e8e4da"/><text x="981" y="211">APIs</text>
    </g>

    <path d="M600 273V310" stroke="#335f4b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="68" y="319" width="1064" height="130" fill="#f8f7f2" stroke="#c9c6bc" stroke-width="2"/>
    <text x="95" y="356" fill="#335f4b" font-size="14" font-weight="800" letter-spacing="2">02 · MODULES</text>
    <text x="95" y="390" fill="#1c201d" font-size="20" font-weight="700">Reusable business capability</text>
    <rect x="420" y="350" width="634" height="69" fill="#e8e4da"/>
    <text x="737" y="380" text-anchor="middle" fill="#1c201d" font-size="21" font-weight="750">Tools + Task Instructions</text>
    <text x="737" y="405" text-anchor="middle" fill="#676b64" font-size="15">Example · 3C Analysis Module</text>

    <path d="M600 450V487" stroke="#335f4b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="68" y="496" width="1064" height="130" fill="#f8f7f2" stroke="#c9c6bc" stroke-width="2"/>
    <text x="95" y="533" fill="#335f4b" font-size="14" font-weight="800" letter-spacing="2">03 · AGENT RUNS</text>
    <text x="95" y="567" fill="#1c201d" font-size="20" font-weight="700">Compose modules</text>
    <rect x="420" y="527" width="300" height="69" fill="#e8e4da"/>
    <text x="570" y="557" text-anchor="middle" fill="#1c201d" font-size="20" font-weight="750">Sequential</text>
    <text x="570" y="582" text-anchor="middle" fill="#676b64" font-size="14">Research → Analyze → Synthesize</text>
    <rect x="738" y="527" width="316" height="69" fill="#e8e4da"/>
    <text x="896" y="557" text-anchor="middle" fill="#1c201d" font-size="20" font-weight="750">Multi-Agent</text>
    <text x="896" y="582" text-anchor="middle" fill="#676b64" font-size="14">Specialists in parallel + synthesis</text>

    <path d="M600 627V664" stroke="#335f4b" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="68" y="673" width="1064" height="94" fill="#1c201d"/>
    <text x="95" y="708" fill="#b8d1c5" font-size="14" font-weight="800" letter-spacing="2">04 · DYNAMIC ORCHESTRATION</text>
    <text x="95" y="742" fill="#ffffff" font-size="19" font-weight="700">Runtime workflow generation</text>
    <g fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle">
      <text x="514" y="730">Decompose</text><text x="636" y="730" fill="#9fc0b0">→</text>
      <text x="714" y="730">Plan</text><text x="790" y="730" fill="#9fc0b0">→</text>
      <text x="913" y="730">Build DAG</text>
    </g>
  </g>
  <text x="600" y="805" text-anchor="middle" fill="#335f4b" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="800">Build once, compose many workflows.</text>
</svg>

