<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">기업용 에이전트 빙산</title>
  <desc id="desc">모델, 프롬프트, 도구 호출, 에이전트 구조와 화면은 수면 위에 보인다. 평가, 보안, 운영과 변경 관리는 수면 아래 더 큰 구조를 이룬다.</desc>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dce8e2"/><stop offset="1" stop-color="#adcbbb"/></linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9ece6"/><stop offset="1" stop-color="#9dbbab"/></linearGradient>
  </defs>
  <rect width="1200" height="840" fill="#f2f0e9"/>
  <text x="68" y="68" fill="#1c201d" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="32" font-weight="700">기업용 에이전트 빙산</text>
  <text x="68" y="103" fill="#676b64" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="18">눈에 보이는 데모는 실제 운영 준비도의 작은 일부다</text>

  <rect x="0" y="340" width="1200" height="430" fill="url(#sea)"/>
  <path d="M0 340 C130 328 220 352 340 340 C475 327 565 352 700 338 C830 325 965 355 1200 337" fill="none" stroke="#668f7b" stroke-width="4"/>
  <text x="1050" y="321" fill="#335f4b" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="800" letter-spacing="1">수면선</text>

  <path d="M395 338 L485 195 L565 228 L618 145 L675 231 L758 199 L815 338 Z" fill="#f8f7f2" stroke="#9eb5aa" stroke-width="2"/>
  <path d="M394 341 L815 341 L1050 716 L170 716 Z" fill="url(#ice)" stroke="#6f9b85" stroke-width="2"/>

  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif" text-anchor="middle">
    <text x="605" y="174" fill="#335f4b" font-size="14" font-weight="800" letter-spacing="1.5">모두가 보는 것</text>
    <text x="604" y="254" fill="#1c201d" font-size="18" font-weight="700">모델 · 프롬프트 · 도구 호출</text>
    <text x="604" y="282" fill="#1c201d" font-size="18" font-weight="700">에이전트 구조 · 화면</text>
  </g>

  <text x="600" y="393" text-anchor="middle" fill="#274b3b" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="800" letter-spacing="1.7">실제 운영에 필요한 것</text>
  <g font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="650" fill="#263c32">
    <g>
      <circle cx="320" cy="445" r="4" fill="#335f4b"/><text x="335" y="451">평가</text>
      <circle cx="320" cy="484" r="4" fill="#335f4b"/><text x="335" y="490">관측 가능성</text>
      <circle cx="320" cy="523" r="4" fill="#335f4b"/><text x="335" y="529">인증</text>
      <circle cx="320" cy="562" r="4" fill="#335f4b"/><text x="335" y="568">권한 부여</text>
      <circle cx="320" cy="601" r="4" fill="#335f4b"/><text x="335" y="607">상태 관리</text>
      <circle cx="320" cy="640" r="4" fill="#335f4b"/><text x="335" y="646">재시도와 장애 복구</text>
      <circle cx="320" cy="679" r="4" fill="#335f4b"/><text x="335" y="685">변경 관리</text>
    </g>
    <g>
      <circle cx="650" cy="445" r="4" fill="#335f4b"/><text x="665" y="451">보안과 감사</text>
      <circle cx="650" cy="484" r="4" fill="#335f4b"/><text x="665" y="490">지연 시간과 인프라</text>
      <circle cx="650" cy="523" r="4" fill="#335f4b"/><text x="665" y="529">모니터링</text>
      <circle cx="650" cy="562" r="4" fill="#335f4b"/><text x="665" y="568">비용 관리</text>
      <circle cx="650" cy="601" r="4" fill="#335f4b"/><text x="665" y="607">버전 관리</text>
      <circle cx="650" cy="640" r="4" fill="#335f4b"/><text x="665" y="646">사람에게 넘기기</text>
    </g>
  </g>

  <rect x="120" y="758" width="960" height="58" fill="#1c201d"/>
  <text x="600" y="783" text-anchor="middle" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="17" font-weight="750">데모를 인상적으로 만드는 것은 수면 위에 있다.</text>
  <text x="600" y="805" text-anchor="middle" fill="#b8d1c5" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="16">시스템을 살아남게 하는 것은 수면 아래에 있다.</text>
</svg>
